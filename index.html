<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Para ti 🌷</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="scene">
      <!-- =========================================
         FONDO
    ========================================== -->

      <div class="stars"></div>

      <!-- =========================================
         TITULO
    ========================================== -->

      <header class="title">
        <h1>Feliz Día de las Flores Amarillas</h1>

        <p>Un pequeño ramo hecho especialmente para ti</p>
      </header>

      <!-- =========================================
         MARIPOSA 1
    ========================================== -->

      <div class="butterfly butterfly-1">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>

        <div class="body"></div>
      </div>

      <!-- =========================================
         MARIPOSA 2
    ========================================== -->

      <div class="butterfly butterfly-2">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>

        <div class="body"></div>
      </div>

      <!-- =========================================
         MARIPOSA 3
    ========================================== -->

      <div class="butterfly butterfly-3">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>

        <div class="body"></div>
      </div>

      <!-- =========================================
         RAMO
    ========================================== -->

      <main class="bouquet-container">
        <div class="bouquet">
          <!-- =================================
                 TALLOS
            ================================== -->

          <div class="stem stem-1"></div>
          <div class="stem stem-2"></div>
          <div class="stem stem-3"></div>
          <div class="stem stem-4"></div>
          <div class="stem stem-5"></div>
          <div class="stem stem-6"></div>
          <div class="stem stem-7"></div>

          <!-- =================================
                 HOJAS
            ================================== -->

          <div class="leaf leaf-1"></div>
          <div class="leaf leaf-2"></div>
          <div class="leaf leaf-3"></div>
          <div class="leaf leaf-4"></div>
          <div class="leaf leaf-5"></div>
          <div class="leaf leaf-6"></div>

          <!-- =================================
                 TULIPANES
            ================================== -->

          <div class="tulip tulip-1">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="tulip tulip-2">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="tulip tulip-3">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="tulip tulip-4">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="tulip tulip-5">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="tulip tulip-6">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="tulip tulip-7">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <!-- =================================
                 ENVOLTURA
            ================================== -->

          <div class="paper"></div>

          <!-- =================================
                 LISTON
            ================================== -->

          <div class="ribbon"></div>

          <div class="ribbon-knot"></div>

          <div class="ribbon-tail ribbon-left"></div>

          <div class="ribbon-tail ribbon-right"></div>
        </div>
      </main>

      <!-- =========================================
         BOTON
    ========================================== -->

      <button id="openMessage" class="message-button">
        💌 &nbsp; Abrir mi mensaje
      </button>

      <!-- =========================================
         CARTA
    ========================================== -->

      <div id="messageOverlay" class="message-overlay">
        <div class="message-card">
          <button id="closeMessage" class="close-button">×</button>

          <div class="card-heart">♡</div>

          <h2>Para ti</h2>

          <p>
            Hoy es un día especial y lo quise hacer un poco más a mi estilo, espero te guste.
          </p>

          <p>
            Que siempre encuentres motivos para sonreír y que nunca te falten
            razones para florecer.
          </p>

          <div class="signature">TQM ♡</div>
        </div>
      </div>

      <!-- =========================================
         PETALOS
    ========================================== -->

      <div id="petals"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
